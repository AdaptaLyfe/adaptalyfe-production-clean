name: adaptalyfe_mobile
description: Separate Flutter mobile client scaffold for Adaptalyfe.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  cupertino_icons: ^1.0.8
  dio: ^5.8.0+1
  equatable: ^2.0.7
  firebase_analytics: ^11.4.6
  firebase_core: ^3.13.0
  firebase_messaging: ^15.2.5
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.0
  flutter_stripe: ^11.5.0
  in_app_purchase: ^3.2.3
  in_app_purchase_android: 0.4.0
  flutter_local_notifications: ^19.0.0
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^9.2.4
  get_it: ^8.0.3
  go_router: ^14.8.1
  flutter_timezone: ^4.1.0
  timezone: ^0.10.0
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/adaptalyfe-icon.png