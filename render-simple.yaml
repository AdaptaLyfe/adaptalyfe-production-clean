services:
  - type: web
    name: adaptalyfe-simple
    env: node
    plan: starter
    buildCommand: npm ci && npm run build && cp dist/production.js server.js && node scripts/check-sensitive-logging.mjs --bundles server.js
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: adaptalyfe-db
          property: connectionString
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: VITE_STRIPE_PUBLIC_KEY
        sync: false

databases:
  - name: adaptalyfe-db
    databaseName: adaptalyfe
    user: adaptalyfe_user
    plan: starter